<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEAN·ON 理</title>
<meta name="description" content="청렴을 켜고, 다듬는다. 청렴 소식과 직접 만든 콘텐츠를 모아두는 곳.">
<meta property="og:title" content="CLEAN·ON 理">
<meta property="og:description" content="청렴을 켜고, 다듬는다. 청렴 소식과 직접 만든 콘텐츠를 모아두는 곳.">
<link rel="icon" href="assets/logo-light.png">
<style>
/* ==========================================================================
   CLEAN·ON 理 — 왼쪽 사이드바 + 1px 테두리 카드 + 자동 벤토 + 에디토리얼 상세
   브랜드 컬러: Cobalt #2542D6 · Cobalt Light #5874FF · Ink #1E2128 · Ground #F4F5F8
   ========================================================================== */
:root{
  --bg:#ffffff; --side:#f8f9fb; --card:#ffffff; --card-2:#f7f8fa;
  --line:#dde0e7; --line-2:#c4c8d2;
  --shadow:0 1px 2px rgba(20,24,40,.05);
  --fg:#1e2128; --muted:#5f6576; --subtle:#8a90a0;
  --accent:#2542d6; --accent-soft:rgba(37,66,214,.08); --on-accent:#ffffff;
  --dot:rgba(30,33,40,.09);
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08090b; --side:#0b0c0e; --card:#131418; --card-2:#17181d;
  --line:#26282f; --line-2:#3a3d47;
  --shadow:none;
  --fg:#eceef3; --muted:#9da2b1; --subtle:#6b7080;
  --accent:#5874ff; --accent-soft:rgba(88,116,255,.14); --on-accent:#ffffff;
  --dot:rgba(255,255,255,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090b; --side:#0b0c0e; --card:#131418; --card-2:#17181d;
  --line:#26282f; --line-2:#3a3d47;
  --shadow:none;
  --fg:#eceef3; --muted:#9da2b1; --subtle:#6b7080;
  --accent:#5874ff; --accent-soft:rgba(88,116,255,.14); --on-accent:#ffffff;
  --dot:rgba(255,255,255,.07); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{flex:none}

/* ---------- 앱 레이아웃 ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 12px 16px}
.brand{display:flex;flex-direction:column;gap:6px;padding:4px 8px 20px}
.logo{display:block;width:168px}
.logo img{display:block;width:100%;height:auto}
.logo .lg-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .lg-light{display:none}:root:not([data-theme="light"]) .logo .lg-dark{display:block}}
:root[data-theme="dark"] .logo .lg-light{display:none}
:root[data-theme="dark"] .logo .lg-dark{display:block}
.kor{font-size:11.5px;color:var(--subtle);letter-spacing:.35em;padding-left:2px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--muted);font-size:14.5px;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--accent-soft);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav .count{margin-left:auto;font:12px var(--mono);color:var(--subtle)}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:12px 8px 0;border-top:1px solid var(--line)}
.switch{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--muted);font-size:13px}
.switch .track{width:34px;height:20px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s var(--ease)}
.switch .knob{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .knob{transform:translateX(14px)}
.switch .state{font:600 11px var(--mono);letter-spacing:.06em;color:var(--subtle);margin-left:auto}
.switch[aria-checked="true"] .state{color:var(--accent)}

.main{min-width:0;padding:48px 56px 72px}
.inner{max-width:1180px;margin:0;display:flex;flex-direction:column;gap:56px}
#view{display:flex;flex-direction:column;gap:40px}
.site-foot{border-top:1px solid var(--line);padding-top:20px;font-size:12.5px;color:var(--subtle);word-break:keep-all}

/* ---------- 공통 ---------- */
.page-head{display:flex;flex-direction:column;gap:10px}
.page-head h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.2;letter-spacing:-.035em;font-weight:750;text-wrap:balance;word-break:keep-all}
.page-head h1 .accent{color:var(--accent)}
.page-head p{margin:0;color:var(--muted);font-size:15.5px;max-width:60ch;word-break:keep-all}
.sec{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
.more{font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.more:hover{color:var(--accent)}
.label{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--font);letter-spacing:-.01em;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:5px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:99px}
.empty{color:var(--subtle);font-size:14px;padding:32px 20px;border:1px dashed var(--line-2);border-radius:10px;text-align:center}

/* ---------- 벤토 ---------- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:border-color .15s var(--ease)}
a.tile:hover{border-color:var(--line-2);background:var(--card-2)}
.t-feature{grid-column:span 2;grid-row:span 2;padding:0;overflow:hidden}
.t-news{grid-column:span 2}
.t-stat,.t-promise{grid-column:span 1}
.t-tags{grid-column:span 4;flex-direction:row;align-items:center;flex-wrap:wrap;gap:12px 20px}

.feature-visual{aspect-ratio:16/9;border-bottom:1px solid var(--line);position:relative;display:grid;place-items:center;
  background-color:var(--card-2);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:16px 16px}
.feature-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature-visual .big-icon{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px var(--accent-soft)}
.feature-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.feature-body h3{margin:0;font-size:20px;line-height:1.35;letter-spacing:-.025em;word-break:keep-all}
.feature-body p{margin:0;color:var(--muted);font-size:14px;word-break:keep-all}
.feature-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--subtle)}
.t-feature:hover .feature-body h3{color:var(--accent)}

.mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini-list li+li{border-top:1px solid var(--line)}
.mini-list a{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:14px 0}
.mini-list .tc{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini-list .cm{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.tile-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.tile-foot:hover{color:var(--accent)}
.mini-list .d{font:12.5px var(--mono);color:var(--subtle)}
.mini-list .t{font-size:14.5px;font-weight:550;line-height:1.45;word-break:keep-all}
.mini-list a:hover .t{color:var(--accent)}
.mini-list .go{color:var(--subtle)}

.stat-num{font:700 40px/1 var(--mono);letter-spacing:-.04em}
.stat-row{display:flex;gap:28px;margin-top:auto}
.upd{font-size:12.5px;color:var(--subtle)}
.stat-row div{display:flex;flex-direction:column;gap:4px}
.stat-row .cap{font-size:12.5px;color:var(--muted)}
.t-promise .stat-num{color:var(--accent)}
.t-promise p{margin:auto 0 0;font-size:13px;color:var(--muted);word-break:keep-all}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;padding:4px 12px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s var(--ease)}
.chip:hover{border-color:var(--line-2);color:var(--fg)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:background .15s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] .dot{background:var(--on-accent)}

/* ---------- 카드 그리드 (Linear 스타일) ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .15s var(--ease)}
.card:hover{border-color:var(--line-2);background:var(--card-2)}
.card-top{height:140px;border-bottom:1px solid var(--line);padding:18px;position:relative;background:var(--card)}
.card-top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-top .ic{color:var(--fg);position:relative}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-body h3{margin:0;font-size:15px;font-weight:650;line-height:1.4;letter-spacing:-.015em;word-break:keep-all}
.card-body p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.card-meta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--subtle)}
.card:hover h3{color:var(--accent)}

/* ---------- 소식 목록 ---------- */
.list{border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:16px;padding:18px 20px;align-items:start;transition:background .15s}
.row+.row{border-top:1px solid var(--line)}
a.row:hover{background:var(--card-2)}
.row .d{font:12.5px/1.9 var(--mono);color:var(--subtle)}
.row .b{display:flex;flex-direction:column;gap:6px;min-width:0}
.row h3{margin:0;font-size:15.5px;font-weight:650;line-height:1.45;word-break:keep-all}
a.row:hover h3{color:var(--accent)}
.row .c{margin:0;font-size:14px;color:var(--muted);word-break:keep-all}
.row .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--subtle)}
.row .go{color:var(--subtle);padding-top:3px;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;white-space:nowrap}
a.row:hover .go{color:var(--accent)}

/* ---------- 에디토리얼 상세 ---------- */
.article{max-width:720px;display:flex;flex-direction:column;gap:28px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);width:max-content}
.back:hover{color:var(--accent)}
.a-head{display:flex;flex-direction:column;gap:14px}
.a-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--subtle)}
.a-head h1{margin:0;font-size:clamp(28px,4.4vw,42px);line-height:1.22;letter-spacing:-.04em;font-weight:780;text-wrap:balance;word-break:keep-all}
.a-lead{margin:0;font-size:18px;line-height:1.65;color:var(--muted);word-break:keep-all}
.tldr{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.tldr ol{margin:0;padding:0;list-style:none;counter-reset:t;display:flex;flex-direction:column;gap:8px}
.tldr li{counter-increment:t;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:15px;font-weight:550;word-break:keep-all}
.tldr li::before{content:counter(t);font:700 12px/22px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;text-align:center;height:22px}
.prose{font-size:16.5px;line-height:1.85;word-break:keep-all}
.prose>*{margin:0 0 1.1em}
.prose h2{font-size:22px;line-height:1.35;letter-spacing:-.025em;margin-top:1.8em}
.prose h3{font-size:18px;margin-top:1.5em}
.prose a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.prose img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.prose blockquote{margin-left:0;padding-left:16px;border-left:2px solid var(--line-2);color:var(--muted)}
.prose ul,.prose ol{padding-left:1.3em}
.prose table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:8px 10px;font-size:14px}
.pull{margin:8px 0;padding:6px 0 6px 24px;border-left:3px solid var(--accent)}
.pull blockquote{margin:0;font-size:clamp(20px,2.6vw,25px);line-height:1.5;font-weight:700;letter-spacing:-.025em;word-break:keep-all}
.prose .pull blockquote,.pull blockquote{border:0;padding:0;color:var(--fg)}
.pull figcaption{margin-top:10px;font-size:13px;color:var(--subtle)}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;font-size:14px;font-weight:650;border:1px solid var(--line-2);background:var(--card)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{color:var(--on-accent);filter:brightness(1.08)}

/* ---------- 소개 ---------- */
.about{max-width:720px;display:flex;flex-direction:column;gap:28px}
.about .intro{margin:0;font-size:19px;line-height:1.75;font-weight:550;word-break:keep-all}
.promise-box{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:22px;display:flex;flex-direction:column;gap:14px}
.promise-box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.promise-box li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:15px;word-break:keep-all}
.promise-box li svg{color:var(--accent);margin-top:3px}
.about .note{margin:0;color:var(--muted);font-size:14.5px}

/* ---------- 진입 모션 ---------- */
#view>*{animation:rise .4s var(--ease) both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- 반응형 ---------- */
@media (max-width:980px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .t-feature{grid-row:auto}
  .feature-visual{aspect-ratio:auto;height:220px}
  .t-tags{grid-column:span 2}
}
@media (max-width:860px){
  .app{display:block}
  .side{position:sticky;top:0;z-index:20;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px 0;
    display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:8px}
  .brand{padding:0;flex-direction:row;align-items:center;gap:10px}
  .logo{width:132px}
  .kor{display:none}
  .nav{grid-column:1/-1;flex-direction:row;overflow-x:auto;gap:2px;margin:0 -4px;padding-bottom:8px;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:6px 12px}
  .nav .count{display:none}
  .side-foot{margin:0;padding:0;border:0;grid-row:1;grid-column:2}
  .switch .label-text{display:none}
  .main{padding:32px 16px 56px}
  .inner{gap:40px}
}
@media (max-width:560px){
  .bento{grid-template-columns:minmax(0,1fr)}
  .t-feature,.t-news,.t-stat,.t-promise,.t-tags{grid-column:auto;grid-row:auto}
  .row{grid-template-columns:minmax(0,1fr);gap:6px;padding:16px}
  .row .go{display:none}
  .mini-list a{grid-template-columns:minmax(0,1fr);gap:2px}
  .mini-list .go{display:none}
  .prose{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <a class="logo" href="#home" aria-label="CLEAN·ON 理 처음으로">
        <img class="lg-light" src="assets/logo-light.png" alt="CLEAN·ON 理">
        <img class="lg-dark" src="assets/logo-dark.png" alt="CLEAN·ON 理">
      </a>
      <span class="kor" aria-hidden="true">클린온리</span>
    </div>
    <nav class="nav" aria-label="메뉴" id="nav"></nav>
    <div class="side-foot">
      <button type="button" class="switch" id="theme" role="switch" aria-checked="false">
        <span class="track"><span class="knob"></span></span>
        <span class="label-text">다크 모드</span>
        <span class="state" id="theme-state">OFF</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="inner">
      <main id="view"><p class="empty">불러오는 중…</p></main>
      <footer class="site-foot" id="footer">운영자는 방문자의 개인정보를 수집하거나 활용하지 않습니다. 이 사이트는 GitHub Pages에서 제공되며, 외부 링크를 누르면 해당 사이트로 이동합니다.</footer>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   데이터: data/news.json · data/contents.json · data/site.json (관리 화면에서 수정)
   본문(body)이나 3줄 요약(summary)이 있는 글만 상세 페이지가 생깁니다.
   ========================================================================== */
let NEWS = [], CONTENTS = [], SITE = {}, activeTag = null, keepTag = false;

const DEFAULT_LABELS = {
  menu_home:"처음", menu_news:"소식", menu_contents:"콘텐츠", menu_about:"소개",
  title_home_news:"최근 소식", title_home_contents:"아카이브 콘텐츠",
  title_news:"청렴 소식", title_contents:"교육 콘텐츠", title_about:"소개"
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = k => esc((SITE[k] && String(SITE[k]).trim()) || DEFAULT_LABELS[k]);
const d10 = d => String(d ?? "").slice(0,10);
const byDate = (a,b) => d10(b.date).localeCompare(d10(a.date));
const fmt = d => d10(d).replaceAll("-", ".");
const isExt = u => /^https?:/i.test(u || "");
const ext = u => isExt(u) ? ' target="_blank" rel="noopener noreferrer"' : '';
const local = u => String(u || "").replace(/^\//, "");
const has = v => v != null && String(v).trim() !== "" && String(v).trim() !== "<p></p>";
const hasDetail = x => has(x.body) || has(x.summary);

/* 고유 번호: 관리 화면이 만든 id, 없으면 원래 순서로 */
const NEWS_ID = (n,i) => "n-" + (n.id || i);
const CONTENT_ID = (c,i) => "c-" + (c.id || i);

/* ---------- 아이콘 (외부 라이브러리 없이 직접 그림) ---------- */
const P = d => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  home: P('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>'),
  news: P('<path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/>'),
  contents: P('<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>'),
  about: P('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  power: P('<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>'),
  ext: P('<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
  arrow: P('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  back: P('<path d="M19 12H5M11 18l-6-6 6-6"/>'),
  check: P('<path d="M5 12.5 10 17l9-10"/>'),
  tag: P('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>'),
  chart: P('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  "인터랙티브": P('<path d="M5 3l14 8-6 2-2 6z"/>'),
  "영상": P('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/>'),
  "카드뉴스": P('<rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h12"/>'),
  "글": P('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/>'),
  "기타": P('<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>')
};
const kindIcon = k => I[k] || I["기타"];
const bigIcon = k => kindIcon(k).replace('width="16" height="16"','width="26" height="26"');

/* ---------- 링크 계산 ---------- */
function newsHref(n, i){ return hasDetail(n) ? "#" + NEWS_ID(n,i) : (n.url || "#" + NEWS_ID(n,i)); }
function contentHref(c, i){
  if (hasDetail(c)) return "#" + CONTENT_ID(c,i);
  return c.file ? local(c.file) : (c.url || "#");
}
/* 원래 순서 번호를 붙인 정렬 목록 */
const sortedNews = () => NEWS.map((n,i)=>({n,i})).sort((a,b)=>byDate(a.n,b.n));
const sortedContents = () => CONTENTS.map((c,i)=>({c,i})).sort((a,b)=>byDate(a.c,b.c));

/* 본문 HTML 정리 (스크립트·외부 삽입 제거) */
function clean(html){
  const doc = new DOMParser().parseFromString(String(html), "text/html");
  doc.querySelectorAll("script,style,iframe,object,embed,form,link,meta").forEach(e => e.remove());
  doc.querySelectorAll("*").forEach(el => {
    [...el.attributes].forEach(a => {
      if (/^on/i.test(a.name)) el.removeAttribute(a.name);
      if (["href","src"].includes(a.name) && /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
    });
    if (el.tagName === "A" && isExt(el.getAttribute("href"))) { el.target = "_blank"; el.rel = "noopener noreferrer"; }
    if (el.tagName === "IMG" && el.getAttribute("src")) el.setAttribute("src", local(el.getAttribute("src")));
  });
  return doc.body.innerHTML;
}
function sloganParts(){
  const s = (SITE.slogan || "청렴을 켜고, 다듬는다. 청렴 소식과 직접 만든 콘텐츠를 모아두는 곳.").trim();
  const m = s.match(/^(.+?[.!?。])\s+(.+)$/);
  const head = m ? m[1] : s, rest = m ? m[2] : "";
  const c = head.indexOf(",");
  const h = c > 0 ? `${esc(head.slice(0,c+1))} <span class="accent">${esc(head.slice(c+1).trim())}</span>` : esc(head);
  return { h, rest: esc(rest) };
}

/* ---------- 조각 ---------- */
function rowItem({n,i}){
  const href = newsHref(n,i), detail = hasDetail(n);
  return `<a class="row" href="${esc(href)}"${detail ? "" : ext(href)}>
    <span class="d">${fmt(n.date)}</span>
    <span class="b">
      <h3>${esc(n.title)}</h3>
      ${has(n.comment) ? `<p class="c">${esc(n.comment)}</p>` : ""}
      <span class="m">${(n.tags||[]).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
        ${has(n.source) ? `<span>${esc(n.source)}</span>` : ""}</span>
    </span>
    <span class="go">${detail ? "읽기 " + I.arrow : "원문 " + I.ext}</span>
  </a>`;
}
function cardItem({c,i}){
  const href = contentHref(c,i), detail = hasDetail(c);
  return `<a class="card" href="${esc(href)}"${detail ? "" : ext(href)}>
    <div class="card-top">${has(c.thumbnail) ? `<img src="${esc(local(c.thumbnail))}" alt="" loading="lazy">` : `<span class="ic">${kindIcon(c.kind)}</span>`}</div>
    <div class="card-body">
      <h3>${esc(c.title)}</h3>
      ${has(c.desc) ? `<p>${esc(c.desc)}</p>` : ""}
      <div class="card-meta"><span>${esc(c.kind || "콘텐츠")} · <span class="mono">${fmt(c.date)}</span></span><span>${detail ? I.arrow : (isExt(href) ? I.ext : I.arrow)}</span></div>
    </div>
  </a>`;
}
function tagChips(linkToNews){
  const tags = [...new Set(NEWS.flatMap(n => n.tags || []).filter(Boolean))];
  if (!tags.length) return "";
  const list = linkToNews ? tags : ["전체", ...tags];
  return `<div class="chips" role="toolbar" aria-label="태그">${list.map(t =>
    `<button type="button" class="chip" data-tag="${esc(t)}" data-go="${linkToNews ? 1 : 0}" aria-pressed="${!linkToNews && ((t==="전체"&&!activeTag)||t===activeTag)}"><span class="dot"></span>${esc(t)}</button>`).join("")}</div>`;
}

/* ---------- 화면 ---------- */
const views = {
  home(){
    const sp = sloganParts();
    const cs = sortedContents(), ns = sortedNews();
    const feat = cs[0];
    const lastDate = [...NEWS, ...CONTENTS].map(x => d10(x.date)).sort().pop();
    const featTile = feat ? (() => {
      const href = contentHref(feat.c, feat.i), detail = hasDetail(feat.c);
      return `<a class="tile t-feature" href="${esc(href)}"${detail ? "" : ext(href)}>
        <div class="feature-visual">${has(feat.c.thumbnail) ? `<img src="${esc(local(feat.c.thumbnail))}" alt="">` : `<span class="big-icon">${bigIcon(feat.c.kind)}</span>`}</div>
        <div class="feature-body">
          <div class="feature-meta"><span class="badge">${esc(feat.c.kind || "콘텐츠")}</span><span class="mono">${fmt(feat.c.date)}</span><span>새 콘텐츠</span></div>
          <h3>${esc(feat.c.title)}</h3>
          ${has(feat.c.desc) ? `<p>${esc(feat.c.desc)}</p>` : ""}
        </div></a>`;
    })() : `<a class="tile t-feature" href="#about">
        <div class="feature-visual"><span class="big-icon">${I.power.replace('width="16" height="16"','width="26" height="26"')}</span></div>
        <div class="feature-body"><h3>${sp.h}</h3><p>${esc(SITE.about_intro || "")}</p></div></a>`;
    return `
      <header class="page-head"><h1>${sp.h}</h1>${sp.rest ? `<p>${sp.rest}</p>` : ""}</header>
      <section class="bento" aria-label="한눈에 보기">
        ${featTile}
        <div class="tile t-news">
          <span class="label">${I.news} ${L("title_home_news")}</span>
          ${ns.length ? `<ul class="mini-list">${ns.slice(0,4).map(({n,i}) => { const h = newsHref(n,i), dt = hasDetail(n);
            return `<li><a href="${esc(h)}"${dt ? "" : ext(h)}><span class="d">${fmt(n.date)}</span><span class="tc"><span class="t">${esc(n.title)}</span>${has(n.comment) ? `<span class="cm">${esc(n.comment)}</span>` : ""}</span><span class="go">${dt ? I.arrow : I.ext}</span></a></li>`; }).join("")}</ul>`
            : `<p class="empty">아직 올린 소식이 없습니다.</p>`}
          <a class="tile-foot" href="#news"><span>${L("menu_news")} 전체 보기 <span class="mono">${NEWS.length}</span></span>${I.arrow}</a>
        </div>
        <div class="tile t-stat">
          <span class="label">${I.chart} 아카이브</span>
          <div class="stat-row">
            <div><span class="stat-num">${NEWS.length}</span><span class="cap">소식</span></div>
            <div><span class="stat-num">${CONTENTS.length}</span><span class="cap">콘텐츠</span></div>
          </div>
          ${lastDate ? `<span class="upd">마지막 업데이트 <span class="mono">${fmt(lastDate)}</span></span>` : ""}
        </div>
        <a class="tile t-promise" href="#about">
          <span class="label">${I.power} 개인정보 수집</span>
          <span class="stat-num">0</span>
          <p>회원가입, 댓글, 방문자 분석 도구가 없습니다.</p>
        </a>
        ${tagChips(true) ? `<div class="tile t-tags"><span class="label">${I.tag} 태그로 찾기</span>${tagChips(true)}</div>` : ""}
      </section>
      ${cs.length > 1 ? `<section class="sec">
        <div class="sec-head"><h2>${L("title_home_contents")}</h2><a class="more" href="#contents">${L("menu_contents")} 전체 ${I.arrow}</a></div>
        <div class="cards">${cs.slice(1,9).map(cardItem).join("")}</div>
      </section>` : ""}`;
  },
  news(){
    const items = sortedNews().filter(({n}) => !activeTag || (n.tags||[]).includes(activeTag));
    return `<header class="page-head"><h1>${L("title_news")}</h1><p><span class="mono">${NEWS.length}</span>건의 소식. 원문 링크와 함께 짧게 정리합니다.</p></header>
      <section class="sec">${tagChips(false)}
        ${items.length ? `<div class="list">${items.map(rowItem).join("")}</div>` : `<p class="empty">아직 올린 소식이 없습니다.</p>`}
      </section>`;
  },
  contents(){
    const items = sortedContents();
    return `<header class="page-head"><h1>${L("title_contents")}</h1><p><span class="mono">${CONTENTS.length}</span>개의 콘텐츠. 직접 만든 교육 자료를 모아 둡니다.</p></header>
      <section class="sec">${items.length ? `<div class="cards">${items.map(cardItem).join("")}</div>` : `<p class="empty">아직 올린 콘텐츠가 없습니다.</p>`}</section>`;
  },
  about(){
    return `<header class="page-head"><h1>${L("title_about")}</h1></header>
      <section class="about">
        ${has(SITE.about_intro) ? `<p class="intro">${esc(SITE.about_intro)}</p>` : ""}
        ${(SITE.promises||[]).filter(Boolean).length ? `<div class="promise-box"><span class="label">${I.power} ${esc(SITE.promise_title || "이 사이트의 약속")}</span>
          <ul>${SITE.promises.filter(Boolean).map(p => `<li>${I.check}<span>${esc(p)}</span></li>`).join("")}</ul></div>` : ""}
        ${has(SITE.about_note) ? `<p class="note">${esc(SITE.about_note)}</p>` : ""}
      </section>`;
  }
};

function detail(type, id){
  const isNews = type === "n";
  const list = isNews ? NEWS : CONTENTS;
  const idx = list.findIndex((x,i) => (isNews ? NEWS_ID(x,i) : CONTENT_ID(x,i)) === `${type}-${id}`);
  const x = list[idx];
  if (!x) return `<p class="empty">글을 찾을 수 없습니다. <a class="more" href="#home">처음으로</a></p>`;
  document.title = `${x.title} · CLEAN·ON 理`;
  const backKey = isNews ? "news" : "contents";
  const lines = String(x.summary || "").split(/\n+/).map(s => s.replace(/^\s*([-•*]|\d+[.)])\s*/, "").trim()).filter(Boolean);
  let body = has(x.body) ? clean(x.body) : "";
  const quote = has(x.quote) ? `<figure class="pull"><blockquote>${esc(x.quote)}</blockquote>${has(x.quote_source) ? `<figcaption>${esc(x.quote_source)}</figcaption>` : ""}</figure>` : "";
  /* 인용구는 본문 첫 문단 뒤에 끼워 넣음 */
  let bodyHtml = body, quoteOutside = quote;
  if (body && quote) {
    const tmp = document.createElement("div"); tmp.innerHTML = body;
    if (tmp.children.length >= 2) { tmp.children[0].insertAdjacentHTML("afterend", quote); bodyHtml = tmp.innerHTML; quoteOutside = ""; }
  }
  const lead = isNews ? x.comment : x.desc;
  const target = isNews ? x.url : (x.file ? local(x.file) : x.url);
  const btnText = isNews ? `${esc(x.source || "원문")} 원문 보기` : (x.file ? "콘텐츠 열기" : "바로 가기");
  return `<article class="article">
    <a class="back" href="#${backKey}">${I.back} ${L("menu_" + backKey)}</a>
    <header class="a-head">
      <div class="a-meta">${isNews ? (x.tags||[]).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("") : `<span class="badge">${esc(x.kind || "콘텐츠")}</span>`}
        <span class="mono">${fmt(x.date)}</span>${isNews && has(x.source) ? `<span>· ${esc(x.source)}</span>` : ""}</div>
      <h1>${esc(x.title)}</h1>
      ${has(lead) ? `<p class="a-lead">${esc(lead)}</p>` : ""}
    </header>
    ${lines.length ? `<section class="tldr" aria-label="3줄 요약"><span class="label">${I.check} 3줄 요약</span><ol>${lines.slice(0,5).map(l => `<li>${esc(l)}</li>`).join("")}</ol></section>` : ""}
    ${quoteOutside}
    ${bodyHtml ? `<div class="prose">${bodyHtml}</div>` : ""}
    ${has(target) ? `<div class="actions"><a class="btn primary" href="${esc(target)}"${ext(target)}>${btnText} ${isExt(target) ? I.ext : I.arrow}</a><a class="btn" href="#${backKey}">목록으로</a></div>` : ""}
  </article>`;
}

/* ---------- 렌더 ---------- */
function renderNav(key){
  const items = [["home",I.home,""],["news",I.news,NEWS.length],["contents",I.contents,CONTENTS.length],["about",I.about,""]];
  $("#nav").innerHTML = items.map(([k,ic,cnt]) =>
    `<a href="#${k}" ${k===key ? 'aria-current="page"' : ""}>${ic}<span>${L("menu_"+k)}</span>${cnt!=="" ? `<span class="count">${cnt}</span>` : ""}</a>`).join("");
}
function render(){
  const h = location.hash.slice(1);
  const m = h.match(/^([nc])-(.+)$/);
  let key = m ? (m[1] === "n" ? "news" : "contents") : ((h in views) ? h : "home");
  if (!m) document.title = key === "home" ? "CLEAN·ON 理" : `${(SITE["menu_"+key] || DEFAULT_LABELS["menu_"+key])} · CLEAN·ON 理`;
  $("#view").innerHTML = m ? detail(m[1], m[2]) : views[key]();
  renderNav(key);
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const t = b.dataset.tag;
    activeTag = t === "전체" ? null : t;
    if (b.dataset.go === "1") { keepTag = true; location.hash = "news"; } else render();
  });
}
window.addEventListener("hashchange", () => {
  if (!keepTag) activeTag = null;
  keepTag = false;
  render();
  window.scrollTo(0, 0);
});

/* ---------- 다크 모드 스위치 ---------- */
const store = {
  get(){ try { return localStorage.getItem("cleanon_theme"); } catch(e) { return null; } },
  set(v){ try { localStorage.setItem("cleanon_theme", v); } catch(e) {} }
};
const mq = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : mq.matches; };
function syncSwitch(){
  const on = isDark();
  $("#theme").setAttribute("aria-checked", on);
  $("#theme-state").textContent = on ? "ON" : "OFF";
}
(function initTheme(){
  const saved = store.get();
  if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  syncSwitch();
  $("#theme").onclick = () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next; store.set(next); syncSwitch();
  };
  mq.addEventListener && mq.addEventListener("change", syncSwitch);
})();

/* ---------- 데이터 불러오기 ---------- */
Promise.all([
  fetch("data/news.json", {cache:"no-store"}).then(r => r.json()).catch(() => []),
  fetch("data/contents.json", {cache:"no-store"}).then(r => r.json()).catch(() => []),
  fetch("data/site.json", {cache:"no-store"}).then(r => r.json()).catch(() => ({}))
]).then(([n, c, s]) => {
  NEWS = Array.isArray(n) ? n : [];
  CONTENTS = Array.isArray(c) ? c : [];
  SITE = (s && typeof s === "object") ? s : {};
  if (has(SITE.footer)) $("#footer").textContent = SITE.footer;
  render();
});
</script>
</body>
